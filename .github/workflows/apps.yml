name: apps

# Builds the Android and Windows apps (flutter/) on real Android and Windows machines and keeps the result as a download on the run's page.
on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/apps.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: logoless-android
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath logoless-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: logoless-windows
          path: flutter/logoless-windows.zip
          retention-days: 30
